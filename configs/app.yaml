# All relative paths resolve from this file's directory (configs/).
schema_version: 1

# Expected location for your previously selected Sentence Transformer model.
# Place the complete saved model here, or replace this with its existing path.
# This setting does not choose or download a model.
model_dir: ../models/embeddings

# Chroma snapshots and the active-index pointer are stored here on ingestion.
storage_dir: ../storage

# Explicit allowlist of course notes; no recursive folder scanning.
source_manifest: sources.yaml

# Keep these empty unless your chosen embedding model requires prefixes.
# Required prefixes must match the model's document/query conventions exactly.
document_prefix: ""
query_prefix: ""

# Local Qwen2.5-1.5B-Instruct weights saved by setup_generation_model.py.
# This is separate from the Sentence Transformer used for embeddings.
generation:
  model_dir: ../models/generation
  # Total prompt (including chat formatting) plus reserved output must fit.
  context_window_tokens: 4096
  max_output_tokens: 384
  # Cooperative decoding limit; not a hard deadline or model-loading timeout.
  max_generation_seconds: 120
